<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plumber Quest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hud" aria-label="Game stats and statuses">
        <div>Lives: <span id="lives">3</span></div>
        <div>Time: <span id="time">0.0</span>s</div>
      </section>

      <section class="game-stage" id="gameStage" aria-label="Game area wrapper">
        <canvas id="game" width="960" height="540" aria-label="Game area"></canvas>
      </section>

      <section class="controls">
        <button id="restart" type="button">Restart</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
