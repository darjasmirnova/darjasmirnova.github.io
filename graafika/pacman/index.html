<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-wrapper">
            <div class="header">
                <h1>🎮 PACMAN 🎮</h1>
                <div class="stats-container">
                    <div class="stat-item">
                        <span class="label">SCORE:</span>
                        <span id="score" class="value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">LEVEL:</span>
                        <span id="level" class="value">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">LIVES:</span>
                        <span id="lives" class="value">❤️❤️❤️</span>
                    </div>
                </div>
            </div>

            <div id="gameBoard" class="game-board">
                <!-- Game board is generated in JS -->
            </div>

            <div class="control-panel">
                <div class="controls">
                    <button id="startBtn" class="btn btn-start">▶️ START</button>
                    <button id="pauseBtn" class="btn btn-pause" disabled>⏸️ PAUSE</button>
                    <button id="resetBtn" class="btn btn-reset">🔄 RESET</button>
                </div>
                <p class="instructions">⬆️ ⬇️ ⬅️ ➡️ or WASD to move</p>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
