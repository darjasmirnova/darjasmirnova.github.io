<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Edge Warp - Pac-Man Efekt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Grid background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        /* Edge indicators */
        .edge-indicator {
            position: fixed;
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.3), transparent);
            z-index: 1;
            pointer-events: none;
        }

        .edge-indicator.top {
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to bottom, rgba(255, 215, 0, 0.5), transparent);
        }

        .edge-indicator.bottom {
            bottom: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to top, rgba(255, 215, 0, 0.5), transparent);
        }

        .edge-indicator.left {
            top: 0;
            left: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(to right, rgba(255, 215, 0, 0.5), transparent);
        }

        .edge-indicator.right {
            top: 0;
            right: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(to left, rgba(255, 215, 0, 0.5), transparent);
        }

        /* Header */
        .header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
            pointer-events: none;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        /* Draggable object */
        .draggable {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: move;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease;
            z-index: 10;
        }

        .draggable:hover {
            transform: scale(1.1);
        }

        .draggable.dragging {
            transform: scale(1.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .draggable.warping {
            animation: warpEffect 0.3s ease-out;
        }

        @keyframes warpEffect {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.5); }
        }

        /* Trail effect */
        .trail {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: trailFade 0.5s ease-out forwards;
        }

        @keyframes trailFade {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* Warp flash effect */
        .warp-flash {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            background: rgba(255, 215, 0, 0.5);
            animation: flashFade 0.4s ease-out;
        }

        .warp-flash.horizontal {
            top: 0;
            bottom: 0;
            width: 10px;
        }

        .warp-flash.vertical {
            left: 0;
            right: 0;
            height: 10px;
        }

        @keyframes flashFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Control panel */
        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 280px;
        }

        .control-panel h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats {
            background: rgba(0, 0, 0, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            color: #333;
            font-weight: bold;
        }

        button {
            width: 100%;
            background: #667eea;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            margin-bottom: 8px;
            pointer-events: all;
        }

        button:last-child {
            margin-bottom: 0;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        button.secondary:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        /* Info panel */
        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            max-width: 250px;
        }

        .info-panel h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        .info-panel p {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .warp-log {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 11px;
            color: #666;
            font-family: 'Courier New', monospace;
        }

        .warp-log-entry {
            margin-bottom: 4px;
            padding: 4px;
            background: white;
            border-radius: 4px;
        }

        .warp-direction {
            display: inline-block;
            padding: 2px 6px;
            background: #FFD700;
            color: #333;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>

    <!-- Edge indicators -->
    <div class="edge-indicator top"></div>
    <div class="edge-indicator bottom"></div>
    <div class="edge-indicator left"></div>
    <div class="edge-indicator right"></div>

    <div class="header">
        <h1>🎮 Screen Edge Warp</h1>
        <p>Lohistage objekte ekraani servast välja!</p>
    </div>

    <div class="info-panel">
        <h3>📜 Warp ajalugu</h3>
        <div class="warp-log" id="warpLog">
            <p style="text-align: center; color: #999;">Pole veel ühtegi warpi...</p>
        </div>
    </div>

    <div class="control-panel">
        <h3>⚙️ Kontrollid</h3>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Objekte:</span>
                <span class="stat-value" id="objectCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Warpe kokku:</span>
                <span class="stat-value" id="warpCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Viimane:</span>
                <span class="stat-value" id="lastWarp">-</span>
            </div>
        </div>

        <button id="addBtn">➕ Lisa objekt</button>
        <button id="scatterBtn" class="secondary">💫 Pilluta laiali</button>
        <button id="centerBtn" class="secondary">🎯 Keskmesse</button>
        <button id="resetBtn" class="secondary">🔄 Lähtesta</button>
    </div>

    <script>
        const objectCountEl = document.getElementById('objectCount');
        const warpCountEl = document.getElementById('warpCount');
        const lastWarpEl = document.getElementById('lastWarp');
        const warpLog = document.getElementById('warpLog');
        const addBtn = document.getElementById('addBtn');
        const scatterBtn = document.getElementById('scatterBtn');
        const centerBtn = document.getElementById('centerBtn');
        const resetBtn = document.getElementById('resetBtn');

        let objects = [];
        let draggedObject = null;
        let offsetX = 0;
        let offsetY = 0;
        let warpCount = 0;
        let trailInterval = null;

        // Emojis for objects
        const emojis = ['🎯', '⚽', '🏀', '🎱', '🎾', '🏈', '⚾', '🥎', '🎳', '🏐', 
                        '🚀', '✈️', '🛸', '🎪', '🎭', '🎨', '🎮', '🎲', '🎯', '⭐'];
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', 
                        '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B500', '#52B788'];

        // Create object
        function createObject(x, y) {
            const obj = document.createElement('div');
            obj.className = 'draggable';
            obj.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            obj.style.background = colors[Math.floor(Math.random() * colors.length)];
            obj.style.left = x + 'px';
            obj.style.top = y + 'px';
            
            obj.addEventListener('mousedown', startDrag);
            document.body.appendChild(obj);
            
            objects.push(obj);
            updateStats();
            
            return obj;
        }

        // Start dragging
        function startDrag(e) {
            draggedObject = this;
            const rect = draggedObject.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            
            draggedObject.classList.add('dragging');
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            
            // Start trail
            trailInterval = setInterval(createTrail, 50);
            
            e.preventDefault();
        }

        // Drag
        function drag(e) {
            if (!draggedObject) return;
            
            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;
            
            const rect = draggedObject.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            
            // Check for edge warping
            let warped = false;
            let warpDirection = '';
            
            // Left edge -> Right edge
            if (x + width < 0) {
                x = window.innerWidth;
                warped = true;
                warpDirection = 'Vasak ➜ Parem';
                createWarpFlash('left');
            }
            // Right edge -> Left edge
            else if (x > window.innerWidth) {
                x = -width;
                warped = true;
                warpDirection = 'Parem ➜ Vasak';
                createWarpFlash('right');
            }
            
            // Top edge -> Bottom edge
            if (y + height < 0) {
                y = window.innerHeight;
                warped = true;
                warpDirection = warpDirection ? warpDirection + ' + Üles ➜ Alla' : 'Üles ➜ Alla';
                createWarpFlash('top');
            }
            // Bottom edge -> Top edge
            else if (y > window.innerHeight) {
                y = -height;
                warped = true;
                warpDirection = warpDirection ? warpDirection + ' + Alla ➜ Üles' : 'Alla ➜ Üles';
                createWarpFlash('bottom');
            }
            
            if (warped) {
                draggedObject.classList.add('warping');
                setTimeout(() => {
                    draggedObject.classList.remove('warping');
                }, 300);
                
                warpCount++;
                lastWarpEl.textContent = warpDirection;
                addWarpLog(draggedObject.textContent, warpDirection);
                updateStats();
            }
            
            draggedObject.style.left = x + 'px';
            draggedObject.style.top = y + 'px';
        }

        // Stop dragging
        function stopDrag() {
            if (draggedObject) {
                draggedObject.classList.remove('dragging');
                draggedObject = null;
            }
            
            if (trailInterval) {
                clearInterval(trailInterval);
                trailInterval = null;
            }
            
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // Create trail
        function createTrail() {
            if (!draggedObject) return;
            
            const rect = draggedObject.getBoundingClientRect();
            const trail = document.createElement('div');
            trail.className = 'trail';
            trail.style.width = '40px';
            trail.style.height = '40px';
            trail.style.left = (rect.left + rect.width / 2) + 'px';
            trail.style.top = (rect.top + rect.height / 2) + 'px';
            trail.style.background = draggedObject.style.background;
            trail.style.opacity = '0.4';
            
            document.body.appendChild(trail);
            
            setTimeout(() => {
                trail.remove();
            }, 500);
        }

        // Create warp flash
        function createWarpFlash(edge) {
            const flash = document.createElement('div');
            flash.className = 'warp-flash';
            
            if (edge === 'left') {
                flash.classList.add('horizontal');
                flash.style.left = '0';
            } else if (edge === 'right') {
                flash.classList.add('horizontal');
                flash.style.right = '0';
            } else if (edge === 'top') {
                flash.classList.add('vertical');
                flash.style.top = '0';
            } else if (edge === 'bottom') {
                flash.classList.add('vertical');
                flash.style.bottom = '0';
            }
            
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.remove();
            }, 400);
        }

        // Add to warp log
        function addWarpLog(emoji, direction) {
            // Remove placeholder if exists
            const placeholder = warpLog.querySelector('p');
            if (placeholder) {
                placeholder.remove();
            }
            
            const entry = document.createElement('div');
            entry.className = 'warp-log-entry';
            entry.innerHTML = `${emoji} <span class="warp-direction">${direction}</span>`;
            
            warpLog.insertBefore(entry, warpLog.firstChild);
            
            // Keep only last 20 entries
            while (warpLog.children.length > 20) {
                warpLog.removeChild(warpLog.lastChild);
            }
        }

        // Update stats
        function updateStats() {
            objectCountEl.textContent = objects.length;
            warpCountEl.textContent = warpCount;
        }

        // Add button
        addBtn.addEventListener('click', () => {
            const x = Math.random() * (window.innerWidth - 100) + 50;
            const y = Math.random() * (window.innerHeight - 100) + 50;
            createObject(x, y);
        });

        // Scatter button
        scatterBtn.addEventListener('click', () => {
            objects.forEach(obj => {
                const x = Math.random() * (window.innerWidth - 100);
                const y = Math.random() * (window.innerHeight - 100);
                obj.style.left = x + 'px';
                obj.style.top = y + 'px';
            });
        });

        // Center button
        centerBtn.addEventListener('click', () => {
            const centerX = window.innerWidth / 2 - 40;
            const centerY = window.innerHeight / 2 - 40;
            const radius = 150;
            
            objects.forEach((obj, index) => {
                const angle = (index / objects.length) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                obj.style.transition = 'all 0.5s ease';
                obj.style.left = x + 'px';
                obj.style.top = y + 'px';
                
                setTimeout(() => {
                    obj.style.transition = '';
                }, 500);
            });
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            objects.forEach(obj => obj.remove());
            objects = [];
            warpCount = 0;
            lastWarpEl.textContent = '-';
            warpLog.innerHTML = '<p style="text-align: center; color: #999;">Pole veel ühtegi warpi...</p>';
            updateStats();
            
            // Create initial objects
            for (let i = 0; i < 5; i++) {
                const x = Math.random() * (window.innerWidth - 100) + 50;
                const y = Math.random() * (window.innerHeight - 100) + 50;
                createObject(x, y);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A') {
                addBtn.click();
            } else if (e.key === 's' || e.key === 'S') {
                scatterBtn.click();
            } else if (e.key === 'c' || e.key === 'C') {
                centerBtn.click();
            } else if (e.key === 'r' || e.key === 'R') {
                resetBtn.click();
            }
        });

        // Initialize with some objects
        for (let i = 0; i < 5; i++) {
            const x = Math.random() * (window.innerWidth - 100) + 50;
            const y = Math.random() * (window.innerHeight - 100) + 50;
            createObject(x, y);
        }
    </script>
</body>
</html>
