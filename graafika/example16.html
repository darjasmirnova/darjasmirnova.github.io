<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Shadow Follow - Varjud Järgnevad Kursorile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
            cursor: none;
        }

        /* Custom cursor (päike) */
        .cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        .sun {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #FFD700 0%, #FFA500 50%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 30px #FFD700, 0 0 60px #FFA500;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Konteiner */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        /* Teksti elemendid */
        .text-item {
            text-align: center;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .text-item:hover {
            transform: scale(1.05);
        }

        .heading {
            font-size: 72px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            transition: text-shadow 0.05s ease-out;
            user-select: none;
        }

        .subheading {
            font-size: 36px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            transition: text-shadow 0.05s ease-out;
            user-select: none;
        }

        .text {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.8);
            transition: text-shadow 0.05s ease-out;
            user-select: none;
        }

        /* Grid layout for multiple texts */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 40px;
        }

        .grid-item {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 20px;
            backdrop-filter: blur(10px);
            transition: background 0.3s ease;
        }

        .grid-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Info panel */
        .info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            max-width: 300px;
        }

        .info-panel h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .info-panel p {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .stats {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            color: #333;
            font-weight: bold;
        }

        /* Controls */
        button {
            width: 100%;
            background: #667eea;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            margin-bottom: 8px;
        }

        button:last-child {
            margin-bottom: 0;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button.secondary {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        button.secondary:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        /* Slider */
        .slider-group {
            margin-bottom: 15px;
        }

        .slider-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .slider-value {
            float: right;
            color: #333;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Custom cursor -->
    <div class="cursor">
        <div class="sun"></div>
    </div>

    <!-- Info panel -->
    <div class="info-panel">
        <h3>☀️ Text Shadow Follow</h3>
        <p>Kursor on päike, varjud langevad vastassuunas!</p>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Hiir X:</span>
                <span class="stat-value" id="mouseX">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Hiir Y:</span>
                <span class="stat-value" id="mouseY">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Elemente:</span>
                <span class="stat-value" id="elementCount">0</span>
            </div>
        </div>

        <div class="slider-group">
            <label>
                Varju intensiivsus
                <span class="slider-value" id="intensityValue">50</span>
            </label>
            <input type="range" id="intensitySlider" min="10" max="100" value="50">
        </div>

        <div class="slider-group">
            <label>
                Varju kaugus
                <span class="slider-value" id="distanceValue">20px</span>
            </label>
            <input type="range" id="distanceSlider" min="5" max="50" value="20">
        </div>

        <button id="toggleCursor">🌞 Peida päike</button>
        <button id="colorBtn" class="secondary">🎨 Muuda värvi</button>
    </div>

    <!-- Text content -->
    <div class="container">
        <div class="text-item">
            <h1 class="heading shadow-follow">PÄIKESE VARI</h1>
        </div>

        <div class="text-item">
            <h2 class="subheading shadow-follow">Liiguta hiirt ringi</h2>
        </div>

        <div class="text-item">
            <p class="text shadow-follow">Varjud järgnevad sinu kursorile kui päikesele</p>
        </div>

        <div class="grid-container">
            <div class="grid-item text-item">
                <h2 class="subheading shadow-follow">PÕHJA</h2>
            </div>
            <div class="grid-item text-item">
                <h2 class="subheading shadow-follow">IDA</h2>
            </div>
            <div class="grid-item text-item">
                <h2 class="subheading shadow-follow">LÕUNA</h2>
            </div>
            <div class="grid-item text-item">
                <h2 class="subheading shadow-follow">LÄÄS</h2>
            </div>
        </div>

        <div class="text-item">
            <h1 class="heading shadow-follow">DÜNAAMILINE</h1>
        </div>

        <div class="grid-container">
            <div class="grid-item text-item">
                <h3 class="subheading shadow-follow">Valgus</h3>
                <p class="text shadow-follow">☀️</p>
            </div>
            <div class="grid-item text-item">
                <h3 class="subheading shadow-follow">Vari</h3>
                <p class="text shadow-follow">🌑</p>
            </div>
            <div class="grid-item text-item">
                <h3 class="subheading shadow-follow">Suund</h3>
                <p class="text shadow-follow">➡️</p>
            </div>
        </div>

        <div class="text-item">
            <h1 class="heading shadow-follow">INTERAKTIIVNE</h1>
        </div>
    </div>

    <script>
        const cursor = document.querySelector('.cursor');
        const shadowElements = document.querySelectorAll('.shadow-follow');
        const mouseXEl = document.getElementById('mouseX');
        const mouseYEl = document.getElementById('mouseY');
        const elementCountEl = document.getElementById('elementCount');
        const intensitySlider = document.getElementById('intensitySlider');
        const distanceSlider = document.getElementById('distanceSlider');
        const intensityValue = document.getElementById('intensityValue');
        const distanceValue = document.getElementById('distanceValue');
        const toggleCursorBtn = document.getElementById('toggleCursor');
        const colorBtn = document.getElementById('colorBtn');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let shadowIntensity = 50;
        let shadowDistance = 20;
        let showCursor = true;

        // Värviskeemid
        const colorSchemes = [
            { name: 'Kuldne', color: 'rgba(255, 215, 0)' },
            { name: 'Punane', color: 'rgba(255, 80, 80)' },
            { name: 'Sinine', color: 'rgba(80, 150, 255)' },
            { name: 'Roheline', color: 'rgba(80, 200, 120)' },
            { name: 'Lilla', color: 'rgba(180, 100, 255)' },
            { name: 'Must', color: 'rgba(0, 0, 0)' }
        ];
        let currentColorIndex = 0;

        // Uuenda elementide arvu
        elementCountEl.textContent = shadowElements.length;

        // Hiire liikumine
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Uuenda kursori positsiooni
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';

            // Uuenda statistikat
            mouseXEl.textContent = Math.round(mouseX);
            mouseYEl.textContent = Math.round(mouseY);

            // Uuenda varje
            updateShadows();
        });

        // Arvuta ja rakenda varje
        function updateShadows() {
            shadowElements.forEach(element => {
                // Leia elemendi keskpunkt
                const rect = element.getBoundingClientRect();
                const elementX = rect.left + rect.width / 2;
                const elementY = rect.top + rect.height / 2;

                // Arvuta nihe kursorist
                const deltaX = elementX - mouseX;
                const deltaY = elementY - mouseY;

                // Arvuta kaugus
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                // Normaliseeri suund
                const normalizedX = deltaX / distance;
                const normalizedY = deltaY / distance;

                // Arvuta varju positsioon (vastassuunas kursorist)
                const shadowX = normalizedX * shadowDistance;
                const shadowY = normalizedY * shadowDistance;

                // Arvuta läbipaistvus põhinedes kaugusel (kaugemal = nõrgem vari)
                const maxDistance = Math.sqrt(window.innerWidth ** 2 + window.innerHeight ** 2);
                const opacity = Math.max(0.2, 1 - (distance / maxDistance) * 0.7);

                // Arvuta blur põhinedes kaugusel
                const blur = Math.min(shadowDistance / 2, 15);

                // Genereeri mitme kihi varju sügavamaks efektiks
                const currentColor = colorSchemes[currentColorIndex].color;
                const layers = 3;
                let shadowString = '';

                for (let i = 1; i <= layers; i++) {
                    const multiplier = i;
                    const layerOpacity = opacity * (shadowIntensity / 100) / multiplier;
                    const layerBlur = blur * multiplier;
                    
                    shadowString += `${shadowX * multiplier}px ${shadowY * multiplier}px ${layerBlur}px ${currentColor}, ${layerOpacity})`;
                    
                    if (i < layers) {
                        shadowString += ', ';
                    }
                }

                element.style.textShadow = shadowString;
            });
        }

        // Slider kuulajad
        intensitySlider.addEventListener('input', (e) => {
            shadowIntensity = parseInt(e.target.value);
            intensityValue.textContent = shadowIntensity;
            updateShadows();
        });

        distanceSlider.addEventListener('input', (e) => {
            shadowDistance = parseInt(e.target.value);
            distanceValue.textContent = shadowDistance + 'px';
            updateShadows();
        });

        // Kursori näitamise/peitmise nupp
        toggleCursorBtn.addEventListener('click', () => {
            showCursor = !showCursor;
            cursor.style.display = showCursor ? 'block' : 'none';
            toggleCursorBtn.textContent = showCursor ? '🌞 Peida päike' : '🌞 Näita päikest';
        });

        // Värvi muutmise nupp
        colorBtn.addEventListener('click', () => {
            currentColorIndex = (currentColorIndex + 1) % colorSchemes.length;
            colorBtn.textContent = `🎨 ${colorSchemes[currentColorIndex].name}`;
            updateShadows();
        });

        // Klaviatuuri kiirklahvid
        document.addEventListener('keydown', (e) => {
            if (e.key === 'c' || e.key === 'C') {
                toggleCursorBtn.click();
            } else if (e.key === 'v' || e.key === 'V') {
                colorBtn.click();
            } else if (e.key === '+' || e.key === '=') {
                intensitySlider.value = Math.min(100, parseInt(intensitySlider.value) + 5);
                intensitySlider.dispatchEvent(new Event('input'));
            } else if (e.key === '-' || e.key === '_') {
                intensitySlider.value = Math.max(10, parseInt(intensitySlider.value) - 5);
                intensitySlider.dispatchEvent(new Event('input'));
            }
        });

        // Alusta keskelt
        cursor.style.left = mouseX + 'px';
        cursor.style.top = mouseY + 'px';
        updateShadows();
    </script>
</body>
</html>
