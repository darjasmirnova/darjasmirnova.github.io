<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Themes with Sound</title>
    <style>
        body {
            transition: background 0.3s, color 0.3s;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        body.light {
            background: #ffffff;
            color: #000000;
        }
        body.dark {
            background: #000000;
            color: #ffffff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        body.light button {
            background: #007bff;
            color: white;
        }
        body.dark button {
            background: #444;
            color: white;
        }
    </style>
</head>
<body class="light">
    <h1>Theme Toggle</h1>
    <p>This page has light and dark themes. Click the button to toggle and hear a sound.</p>
    <button id="toggle">Toggle Theme</button>
    <script>
        const toggleButton = document.getElementById('toggle');
        const body = document.body;

        // Web Audio API for sound
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(800, audioContext.currentTime); // Frequency
            oscillator.type = 'square'; // Sound type

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('light');
            body.classList.toggle('dark');
            playClickSound();
        });
    </script>
</body>
</html>
