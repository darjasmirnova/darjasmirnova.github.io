<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eraser Mode - Kustutuskumm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Taust */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                linear-gradient(45deg, #FF6B6B 0%, #4ECDC4 25%, #45B7D1 50%, #FFA07A 75%, #98D8C8 100%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Pattern overlay peal */
        .background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.2) 2%, transparent 2%),
                radial-gradient(circle at 60% 70%, rgba(255,255,255,0.15) 3%, transparent 3%),
                radial-gradient(circle at 80% 30%, rgba(255,255,255,0.2) 2.5%, transparent 2.5%),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.1) 2%, transparent 2%);
            background-size: 80px 80px;
            animation: patternMove 20s linear infinite;
        }

        @keyframes patternMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }

        /* Overlay kiht (see, mida kustutatakse) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Erasable grid */
        .erasable-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(15, 1fr);
            pointer-events: all;
        }

        .erasable-cell {
            background: #2c3e50;
            transition: opacity 0.3s ease, background 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .erasable-cell.erased {
            opacity: 0;
            pointer-events: none;
        }

        /* Header */
        .header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
            pointer-events: none;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        /* Control panel */
        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 280px;
        }

        .control-panel h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats {
            background: rgba(0, 0, 0, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            color: #333;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            font-weight: bold;
        }

        button {
            width: 100%;
            background: #667eea;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            margin-bottom: 8px;
            pointer-events: all;
        }

        button:last-child {
            margin-bottom: 0;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.active {
            background: #52B788;
        }

        button.active:hover {
            background: #45a075;
        }

        button.secondary {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        button.secondary:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        /* Slider */
        .slider-group {
            margin-bottom: 15px;
        }

        .slider-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .slider-value {
            float: right;
            color: #333;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        /* Custom cursor */
        .custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            border-radius: 50%;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.1s ease, height 0.1s ease;
            display: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .custom-cursor.active {
            display: block;
        }

        /* Mode indicator */
        .mode-indicator {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(82, 183, 136, 0.95);
            color: white;
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .mode-indicator.show {
            opacity: 1;
        }

        /* Canvas mode */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        canvas.active {
            pointer-events: all;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <canvas id="eraserCanvas"></canvas>

    <div class="overlay">
        <div class="erasable-grid" id="erasableGrid"></div>
    </div>

    <div class="header">
        <h1>🧹 Eraser Mode</h1>
        <p>Liigutage hiirt üle elementide, et neid kustutada!</p>
    </div>

    <div class="control-panel">
        <h3>⚙️ Kontrollid</h3>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Režiim:</span>
                <span class="stat-value" id="modeText">Grid</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Kustutatud:</span>
                <span class="stat-value" id="erasedCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Progress:</span>
            </div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
        </div>

        <div class="slider-group" style="margin-top: 15px;">
            <label>
                Kustutuskummi suurus
                <span class="slider-value" id="sizeValue">40px</span>
            </label>
            <input type="range" id="sizeSlider" min="20" max="100" value="40">
        </div>

        <button id="modeBtn">🔀 Režiim: Canvas</button>
        <button id="eraserBtn" class="active">🧹 Kustutaja: Sees</button>
        <button id="resetBtn" class="secondary">🔄 Lähtesta</button>
        <button id="revealBtn" class="secondary">👁️ Paljasta kõik</button>
    </div>

    <div class="custom-cursor" id="customCursor"></div>
    <div class="mode-indicator" id="modeIndicator">🧹 Kustutusrežiim SEES</div>

    <script>
        const erasableGrid = document.getElementById('erasableGrid');
        const canvas = document.getElementById('eraserCanvas');
        const ctx = canvas.getContext('2d');
        const customCursor = document.getElementById('customCursor');
        const modeIndicator = document.getElementById('modeIndicator');
        const erasedCountEl = document.getElementById('erasedCount');
        const progressFill = document.getElementById('progressFill');
        const modeText = document.getElementById('modeText');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const modeBtn = document.getElementById('modeBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const resetBtn = document.getElementById('resetBtn');
        const revealBtn = document.getElementById('revealBtn');

        let isErasing = true;
        let eraserSize = 40;
        let erasedCells = 0;
        let totalCells = 0;
        let mode = 'grid'; // 'grid' or 'canvas'
        let isMouseDown = false;

        // Setup canvas
        function setupCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Fill with overlay color
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Setup grid
        function setupGrid() {
            erasableGrid.innerHTML = '';
            erasedCells = 0;
            
            // Create grid cells
            for (let i = 0; i < 300; i++) {
                const cell = document.createElement('div');
                cell.className = 'erasable-cell';
                cell.dataset.index = i;
                
                cell.addEventListener('mouseenter', () => {
                    if (isErasing && mode === 'grid') {
                        eraseCell(cell);
                    }
                });
                
                cell.addEventListener('click', () => {
                    if (isErasing && mode === 'grid') {
                        eraseCell(cell);
                    }
                });
                
                erasableGrid.appendChild(cell);
            }
            
            totalCells = 300;
            updateStats();
        }

        // Erase cell
        function eraseCell(cell) {
            if (!cell.classList.contains('erased')) {
                cell.classList.add('erased');
                erasedCells++;
                updateStats();
            }
        }

        // Update stats
        function updateStats() {
            erasedCountEl.textContent = erasedCells;
            const percentage = Math.round((erasedCells / totalCells) * 100);
            progressFill.style.width = percentage + '%';
            progressFill.textContent = percentage + '%';
        }

        // Mouse tracking for custom cursor
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
            
            // Canvas erasing
            if (mode === 'canvas' && isMouseDown && isErasing) {
                eraseOnCanvas(e.clientX, e.clientY);
            }
        });

        // Canvas erasing
        function eraseOnCanvas(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, eraserSize / 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Count erased pixels (approximate)
            erasedCells++;
            updateStats();
        }

        // Mouse events for canvas
        canvas.addEventListener('mousedown', (e) => {
            if (mode === 'canvas' && isErasing) {
                isMouseDown = true;
                eraseOnCanvas(e.clientX, e.clientY);
            }
        });

        document.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        // Eraser size
        sizeSlider.addEventListener('input', (e) => {
            eraserSize = parseInt(e.target.value);
            sizeValue.textContent = eraserSize + 'px';
            customCursor.style.width = eraserSize + 'px';
            customCursor.style.height = eraserSize + 'px';
        });

        // Mode toggle
        modeBtn.addEventListener('click', () => {
            mode = mode === 'grid' ? 'canvas' : 'grid';
            
            if (mode === 'grid') {
                erasableGrid.style.display = 'grid';
                canvas.classList.remove('active');
                modeBtn.textContent = '🔀 Režiim: Canvas';
                modeText.textContent = 'Grid';
            } else {
                erasableGrid.style.display = 'none';
                canvas.classList.add('active');
                modeBtn.textContent = '🔀 Režiim: Grid';
                modeText.textContent = 'Canvas';
                setupCanvas();
                erasedCells = 0;
                totalCells = canvas.width * canvas.height / 100; // approximate
                updateStats();
            }
        });

        // Eraser toggle
        eraserBtn.addEventListener('click', () => {
            isErasing = !isErasing;
            
            if (isErasing) {
                eraserBtn.textContent = '🧹 Kustutaja: Sees';
                eraserBtn.classList.add('active');
                customCursor.classList.add('active');
                modeIndicator.textContent = '🧹 Kustutusrežiim SEES';
                modeIndicator.style.background = 'rgba(82, 183, 136, 0.95)';
                document.body.style.cursor = 'none';
            } else {
                eraserBtn.textContent = '🧹 Kustutaja: Väljas';
                eraserBtn.classList.remove('active');
                customCursor.classList.remove('active');
                modeIndicator.textContent = '✋ Kustutusrežiim VÄLJAS';
                modeIndicator.style.background = 'rgba(255, 107, 107, 0.95)';
                document.body.style.cursor = 'default';
            }
            
            modeIndicator.classList.add('show');
            setTimeout(() => {
                modeIndicator.classList.remove('show');
            }, 1500);
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            if (mode === 'grid') {
                setupGrid();
            } else {
                setupCanvas();
                erasedCells = 0;
                updateStats();
            }
            
            modeIndicator.textContent = '🔄 Lähtestatud!';
            modeIndicator.style.background = 'rgba(102, 126, 234, 0.95)';
            modeIndicator.classList.add('show');
            setTimeout(() => {
                modeIndicator.classList.remove('show');
            }, 1500);
        });

        // Reveal all
        revealBtn.addEventListener('click', () => {
            if (mode === 'grid') {
                const cells = document.querySelectorAll('.erasable-cell');
                cells.forEach((cell, index) => {
                    setTimeout(() => {
                        eraseCell(cell);
                    }, index * 5);
                });
            } else {
                // Clear canvas with animation
                let alpha = 1;
                const fadeOut = setInterval(() => {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    alpha -= 0.05;
                    
                    if (alpha <= 0) {
                        clearInterval(fadeOut);
                        erasedCells = totalCells;
                        updateStats();
                    }
                }, 30);
            }
            
            modeIndicator.textContent = '👁️ Kõik paljastatud!';
            modeIndicator.style.background = 'rgba(255, 193, 7, 0.95)';
            modeIndicator.classList.add('show');
            setTimeout(() => {
                modeIndicator.classList.remove('show');
            }, 1500);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'e' || e.key === 'E') {
                eraserBtn.click();
            } else if (e.key === 'r' || e.key === 'R') {
                resetBtn.click();
            } else if (e.key === 'm' || e.key === 'M') {
                modeBtn.click();
            } else if (e.key === 'v' || e.key === 'V') {
                revealBtn.click();
            } else if (e.key === '+' || e.key === '=') {
                sizeSlider.value = Math.min(100, parseInt(sizeSlider.value) + 5);
                sizeSlider.dispatchEvent(new Event('input'));
            } else if (e.key === '-' || e.key === '_') {
                sizeSlider.value = Math.max(20, parseInt(sizeSlider.value) - 5);
                sizeSlider.dispatchEvent(new Event('input'));
            }
        });

        // Window resize
        window.addEventListener('resize', () => {
            if (mode === 'canvas') {
                setupCanvas();
            }
        });

        // Initialize
        setupGrid();
        customCursor.style.width = eraserSize + 'px';
        customCursor.style.height = eraserSize + 'px';
        customCursor.classList.add('active');
        document.body.style.cursor = 'none';
    </script>
</body>
</html>
