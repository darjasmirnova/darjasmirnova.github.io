<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="toolbar">
        <h1>Particle Lab</h1>
        <div class="group-block">
          <span class="group-title">Material</span>
          <div class="mode-group" aria-label="Material mode">
            <button class="mode-btn is-active" data-material="sand" type="button">Sand</button>
            <button class="mode-btn" data-material="water" type="button">Water</button>
            <button class="mode-btn" data-material="gas" type="button">Gas</button>
          </div>
        </div>
        <div class="group-block">
          <span class="group-title">Brush</span>
          <div class="force-group" aria-label="Brush force mode">
            <button class="force-btn is-active" data-force="attract" type="button">Attract</button>
            <button class="force-btn" data-force="scatter" type="button">Scatter</button>
          </div>
        </div>
        <div class="group-block">
          <span class="group-title">Density Map</span>
          <div class="density-group" aria-label="Density highlight mode">
            <button class="density-btn is-active" data-density="on" type="button">Density On</button>
            <button class="density-btn" data-density="off" type="button">Density Off</button>
          </div>
        </div>
        <div class="group-block">
          <span class="group-title">Time</span>
          <div class="time-group" aria-label="Time control">
            <button class="time-btn" data-time="freeze" type="button">Freeze</button>
            <button class="time-btn is-active" data-time="resume" type="button">Resume</button>
          </div>
        </div>
        <div class="group-block">
          <span class="group-title">Actions</span>
          <div class="action-group" aria-label="Actions">
            <button id="formLogoBtn" type="button">Form Logo</button>
            <button id="clearBtn" type="button">Clear</button>
          </div>
        </div>
        <label class="control">
          Gravity
          <input id="gravity" type="range" min="0" max="2" step="0.02" value="0.35" />
        </label>
        <label class="control">
          Density
          <input id="spawnRate" type="range" min="1" max="20" step="1" value="8" />
        </label>
        <label class="control">
          Wind
          <input id="wind" type="range" min="0" max="2" step="0.02" value="0.3" />
        </label>
      </header>
      <canvas id="paint"></canvas>
      <p class="hint">Buttons are separated by task: Material (Sand/Water/Gas), Brush (Attract/Scatter), Density (On/Off), Time (Freeze/Resume), and Actions.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
