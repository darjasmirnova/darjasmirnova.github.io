<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #2c7a7b 0%, #285e61 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .left-panel {
            padding: 40px;
            background: #f8f9fa;
            overflow-y: auto;
            max-height: 90vh;
        }

        .right-panel {
            padding: 40px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .language-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #0066cc 0%, #0099ff 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .language-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 102, 204, 0.5);
        }

        h1 {
            font-size: 2em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.95em;
            margin-bottom: 30px;
        }

        .input-section {
            margin-bottom: 35px;
        }

        .input-label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 15px;
            color: #38b2ac;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px 12px 35px;
            border: 2px solid #e0e6ed;
            border-radius: 20px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #2c7a7b;
            box-shadow: 0 0 0 3px rgba(44, 122, 123, 0.1);
        }

        .expense-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-left: 4px solid #38b2ac;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .expense-item input {
            flex: 1;
            border: 1px solid #e0e6ed;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.95em;
        }

        .expense-item input:first-of-type {
            flex: 2;
        }

        .expense-item input:focus {
            outline: none;
            border-color: #2c7a7b;
        }

        .btn-remove {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .btn-remove:hover {
            background: #ee5a52;
            transform: scale(1.05);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-add {
            background: #0066cc;
            color: white;
        }

        .btn-add:hover {
            background: linear-gradient(135deg, #0066cc, #00a8ff);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 168, 255, 0.6);
        }

        .btn-clear {
            background: #e3f2fd;
            color: #0066cc;
            border: 2px solid #0066cc;
        }

        .btn-clear:hover {
            background: #0066cc;
            color: white;
        }

        /* Right Panel Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 25px;
            border-radius: 28px;
            background: linear-gradient(135deg, #38b2ac 0%, #4ade80 100%);
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(56, 178, 172, 0.2);
        }

        .stat-card.expenses {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card.balance {
            background: linear-gradient(135deg, #38b2ac 0%, #81e6d9 100%);
            grid-column: 1 / -1;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .warning-box {
            background: #ffe5e5;
            border-left: 4px solid #ff6b6b;
            padding: 15px;
            border-radius: 20px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .warning-box.show {
            display: block;
        }

        .warning-text {
            color: #c92a2a;
            font-weight: 600;
            font-size: 0.95em;
        }

        .chart-container {
            margin-top: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 28px;
        }

        .chart-title {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #expenseChart {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .progress-bar {
            height: 8px;
            background: #e0e6ed;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38b2ac 0%, #4ade80 100%);
            width: 0%;
            transition: width 0.5s ease-out;
            border-radius: 20px;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
        }

        .expense-legend {
            margin-top: 20px;
            font-size: 0.85em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #7f8c8d;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 12px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .left-panel {
                max-height: none;
                border-bottom: 1px solid #e0e6ed;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-card.balance {
                grid-column: 1;
            }

            h1 {
                font-size: 1.6em;
            }

            .stat-value {
                font-size: 2em;
            }
        }

        /* Scrollbar styling */
        .left-panel::-webkit-scrollbar {
            width: 6px;
        }

        .left-panel::-webkit-scrollbar-track {
            background: #f8f9fa;
        }

        .left-panel::-webkit-scrollbar-thumb {
            background: #d0d9e6;
            border-radius: 8px;
        }

        .left-panel::-webkit-scrollbar-thumb:hover {
            background: #c0c9d6;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="language-toggle" id="langToggle" onclick="toggleLanguage()">EN / РУ</button>
        <div class="left-panel">
            <h1>Budget Setup</h1>
            <p class="subtitle">Add your income and expenses</p>

            <div class="input-section">
                <label class="input-label">Monthly Income</label>
                <div class="input-group">
                    <span class="currency-symbol">$</span>
                    <input 
                        type="number" 
                        id="incomeInput" 
                        placeholder="0" 
                        min="0" 
                        step="0.01"
                    >
                </div>
            </div>

            <div class="input-section">
                <label class="input-label">Expenses</label>
                <div id="expensesList"></div>
                <div class="button-group">
                    <button class="btn btn-add" onclick="addExpense()">+ Add Expense</button>
                    <button class="btn btn-clear" onclick="clearAllExpenses()">Clear All</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Expenses</div>
                        <div class="stat-value">
                            $<span id="totalExpenses">0.00</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Income</div>
                        <div class="stat-value">
                            $<span id="displayIncome">0.00</span>
                        </div>
                    </div>
                    <div class="stat-card balance">
                        <div class="stat-label">Remaining Balance</div>
                        <div class="stat-value">
                            $<span id="balance">0.00</span>
                        </div>
                    </div>
                </div>

                <div class="warning-box" id="warningBox">
                    <div class="warning-text">⚠️ Your expenses exceed your income!</div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Expense Breakdown</div>
                <canvas id="expenseChart" width="250" height="250"></canvas>
                <div class="expense-legend" id="expenseLegend"></div>
            </div>
        </div>
    </div>

    <script>
        // State management
        let expenses = JSON.parse(localStorage.getItem('budgetExpenses')) || [];
        let income = parseFloat(localStorage.getItem('budgetIncome')) || 0;

        // DOM elements
        const incomeInput = document.getElementById('incomeInput');
        const expensesList = document.getElementById('expensesList');
        const totalExpensesEl = document.getElementById('totalExpenses');
        const balanceEl = document.getElementById('balance');
        const displayIncomeEl = document.getElementById('displayIncome');
        const warningBox = document.getElementById('warningBox');
        const progressFill = document.getElementById('progressFill');
        const expenseChart = document.getElementById('expenseChart');
        const expenseLegend = document.getElementById('expenseLegend');

        // Initialize
        function init() {
            incomeInput.value = income;
            renderExpenses();
            updateCalculations();
        }

        // Add expense
        function addExpense() {
            const newExpense = {
                id: Date.now(),
                name: '',
                amount: 0
            };
            expenses.push(newExpense);
            renderExpenses();
            updateCalculations();
        }

        // Remove expense
        function removeExpense(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            renderExpenses();
            updateCalculations();
            saveState();
        }

        // Clear all expenses
        function clearAllExpenses() {
            const t = translations[currentLanguage];
            if (expenses.length > 0 && confirm(t.deleteConfirm)) {
                expenses = [];
                renderExpenses();
                updateCalculations();
                saveState();
            }
        }

        // Render expenses list
        function renderExpenses() {
            const t = translations[currentLanguage];
            expensesList.innerHTML = expenses.map(expense => `
                <div class="expense-item">
                    <input 
                        type="text" 
                        placeholder="${t.expenseName}"
                        value="${expense.name}"
                        onchange="updateExpense(${expense.id}, 'name', this.value)"
                        oninput="updateExpense(${expense.id}, 'name', this.value)"
                    >
                    <div class="input-group" style="flex: 1; margin: 0;">
                        <span class="currency-symbol">$</span>
                        <input 
                            type="number" 
                            placeholder="0"
                            value="${expense.amount}"
                            min="0"
                            step="0.01"
                            onchange="updateExpense(${expense.id}, 'amount', parseFloat(this.value))"
                            oninput="updateExpense(${expense.id}, 'amount', parseFloat(this.value))"
                        >
                    </div>
                    <button class="btn-remove" onclick="removeExpense(${expense.id})">×</button>
                </div>
            `).join('');
        }

        // Update expense
        function updateExpense(id, field, value) {
            const expense = expenses.find(exp => exp.id === id);
            if (expense) {
                expense[field] = field === 'amount' ? (isNaN(value) ? 0 : value) : value;
                updateCalculations();
                saveState();
            }
        }

        // Update income
        incomeInput.addEventListener('change', (e) => {
            income = parseFloat(e.target.value) || 0;
            updateCalculations();
            saveState();
        });

        incomeInput.addEventListener('input', (e) => {
            income = parseFloat(e.target.value) || 0;
            updateCalculations();
        });

        // Calculate and update UI
        function updateCalculations() {
            const totalExpenses = expenses.reduce((sum, exp) => sum + (exp.amount || 0), 0);
            const balance = income - totalExpenses;
            const isNegative = balance < 0;

            // Update display values
            displayIncomeEl.textContent = income.toFixed(2);
            totalExpensesEl.textContent = totalExpenses.toFixed(2);
            balanceEl.textContent = Math.abs(balance).toFixed(2);

            // Update balance color
            const balanceCard = document.querySelector('.stat-card.balance');
            if (isNegative) {
                balanceCard.style.background = 'linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%)';
            } else {
                balanceCard.style.background = 'linear-gradient(135deg, #38b2ac 0%, #81e6d9 100%)';
            }

            // Update warning box
            warningBox.classList.toggle('show', isNegative);

            // Update progress bar
            const percentage = income > 0 ? (totalExpenses / income) * 100 : 0;
            progressFill.style.width = Math.min(percentage, 100) + '%';
            progressFill.classList.toggle('warning', isNegative);

            // Update chart
            drawExpenseChart();
        }

        // Draw expense pie chart with Canvas
        function drawExpenseChart() {
            const ctx = expenseChart.getContext('2d');
            const totalExpenses = expenses.reduce((sum, exp) => sum + (exp.amount || 0), 0);
            const t = translations[currentLanguage];
            
            // Clear canvas
            ctx.clearRect(0, 0, expenseChart.width, expenseChart.height);

            // Colors palette
            const colors = [
                '#38b2ac', '#4ade80', '#f093fb', '#f5576c',
                '#38b2ac', '#81e6d9', '#43e97b', '#fa709a',
                '#feca57', '#ff9ff3'
            ];

            const centerX = expenseChart.width / 2;
            const centerY = expenseChart.height / 2;
            const radius = 70;

            // Draw legend
            expenseLegend.innerHTML = '';

            if (expenses.length === 0 || totalExpenses === 0) {
                // Draw empty state
                ctx.fillStyle = '#e0e6ed';
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fill();
                
                ctx.fillStyle = '#7f8c8d';
                ctx.font = '14px -apple-system, BlinkMacSystemFont';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t.noExpenses, centerX, centerY);
                return;
            }

            // Draw pie chart
            let currentAngle = -Math.PI / 2;

            expenses.forEach((expense, index) => {
                if (expense.amount > 0) {
                    const sliceAngle = (expense.amount / totalExpenses) * 2 * Math.PI;
                    const color = colors[index % colors.length];

                    // Draw slice
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
                    ctx.closePath();
                    ctx.fill();

                    // Draw slice border
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Add legend
                    const legendItem = document.createElement('div');
                    legendItem.className = 'legend-item';
                    legendItem.innerHTML = `
                        <div class="legend-color" style="background: ${color};"></div>
                        <span>${expense.name || 'Расход'} - $${expense.amount.toFixed(2)}</span>
                    `;
                    expenseLegend.appendChild(legendItem);

                    currentAngle += sliceAngle;
                }
            });

            // Draw center circle for donut effect
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.5, 0, 2 * Math.PI);
            ctx.fill();

            // Draw total in center
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.total, centerX, centerY - 10);
            ctx.font = '14px -apple-system, BlinkMacSystemFont';
            ctx.fillText(`$${totalExpenses.toFixed(2)}`, centerX, centerY + 10);
        }

        // Save state to localStorage
        function saveState() {
            localStorage.setItem('budgetExpenses', JSON.stringify(expenses));
            localStorage.setItem('budgetIncome', income);
        }

        // Language translations
        const translations = {
            en: {
                title: 'Budget Setup',
                subtitle: 'Add your income and expenses',
                monthlyIncome: 'Monthly Income',
                expenses: 'Expenses',
                addExpense: '+ Add Expense',
                clearAll: 'Clear All',
                totalExpenses: 'Total Expenses',
                income: 'Income',
                balance: 'Remaining Balance',
                warning: '⚠️ Your expenses exceed your income!',
                expenseBreakdown: 'Expense Breakdown',
                expenseName: 'Expense name',
                deleteConfirm: 'Are you sure? This will delete all expenses.',
                noExpenses: 'No expenses',
                total: 'Total',
                expense: 'Expense'
            },
            ru: {
                title: 'Мой Бюджет',
                subtitle: 'Контролируйте доход и расходы',
                monthlyIncome: 'Ежемесячный доход',
                expenses: 'Расходы',
                addExpense: '+ Добавить расход',
                clearAll: 'Очистить всё',
                totalExpenses: 'Всего расходов',
                income: 'Доход',
                balance: 'Остаток баланса',
                warning: '⚠️ Расходы превышают доход!',
                expenseBreakdown: 'Структура расходов',
                expenseName: 'Название расхода',
                deleteConfirm: 'Вы уверены? Это удалит все расходы.',
                noExpenses: 'Нет расходов',
                total: 'Итого',
                expense: 'Расход'
            }
        };

        let currentLanguage = localStorage.getItem('budgetLanguage') || 'en';

        // Toggle language
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'ru' ? 'en' : 'ru';
            localStorage.setItem('budgetLanguage', currentLanguage);
            updateLanguage();
        }

        // Update all text based on current language
        function updateLanguage() {
            const t = translations[currentLanguage];
            
            // Update HTML language attribute
            document.documentElement.lang = currentLanguage;
            
            // Update page title
            document.title = currentLanguage === 'ru' ? 'Симулятор Бюджета' : 'Budget Simulator';
            
            // Update button text
            document.getElementById('langToggle').textContent = currentLanguage === 'ru' ? 'РУ / EN' : 'EN / РУ';
            
            // Update static text
            document.querySelector('h1').textContent = t.title;
            document.querySelector('.subtitle').textContent = t.subtitle;
            
            // Update income input placeholder
            document.getElementById('incomeInput').placeholder = t.monthlyIncome;
            
            // Update labels
            const labels = document.querySelectorAll('.input-label');
            if (labels[0]) labels[0].textContent = t.monthlyIncome;
            if (labels[1]) labels[1].textContent = t.expenses;
            
            // Update buttons
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach((btn) => {
                if (btn.classList.contains('btn-add')) btn.textContent = t.addExpense;
                if (btn.classList.contains('btn-clear')) btn.textContent = t.clearAll;
            });
            
            // Update stat labels
            const statLabels = document.querySelectorAll('.stat-label');
            if (statLabels[0]) statLabels[0].textContent = t.totalExpenses;
            if (statLabels[1]) statLabels[1].textContent = t.income;
            if (statLabels[2]) statLabels[2].textContent = t.balance;
            
            // Update warning text
            const warningText = document.querySelector('.warning-text');
            if (warningText) warningText.textContent = t.warning;
            
            // Update chart title
            const chartTitle = document.querySelector('.chart-title');
            if (chartTitle) chartTitle.textContent = t.expenseBreakdown;
            
            // Re-render expenses to update placeholders
            renderExpenses();
            
            // Redraw chart to update text
            drawExpenseChart();
        }

        // Initialize on load
        init();
        updateLanguage();
    </script>
</body>
</html>
